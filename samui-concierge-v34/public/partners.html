<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Choose your partner — Samui Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;800&family=Noto+Serif+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#06191d;--gold:#d6ad63;--cream:#f7f4ed;--muted:#aab4b1;--line:#ffffff20}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#07181c;color:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.bg{position:fixed;inset:0;background:radial-gradient(circle at 70% 20%,#173a3d 0,#07181c 48%,#03090b 100%);z-index:-2}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 40%,#d6ad6312 50%,transparent 60%);animation:sweep 8s ease-in-out infinite}@keyframes sweep{0%,100%{transform:translateX(-35%)}50%{transform:translateX(35%)}}header{padding:22px 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#06191de8;backdrop-filter:blur(16px);z-index:5}.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}.brand img{width:44px;height:44px;object-fit:contain}.brand span{font-family:Georgia,serif;letter-spacing:.18em;font-size:13px}.brand small{color:var(--gold);font-size:9px}.back{color:var(--cream);text-decoration:none;font-size:11px;letter-spacing:.16em}.wrap{max-width:1220px;margin:auto;padding:70px 5vw 100px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.25em}.hero h1{font:clamp(44px,7vw,88px)/.95 Georgia,serif;margin:14px 0}.hero h1 i{color:var(--gold);font-weight:400}.hero p{max-width:620px;color:#c4cdca;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:48px}.card{background:#ffffff0b;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:.35s transform,.35s border-color,.35s background}.card:hover{transform:translateY(-6px);border-color:#d6ad6366;background:#ffffff12}.photos{height:250px;display:grid;grid-template-columns:2fr 1fr;gap:3px;background:#0c2427}.photos img{width:100%;height:100%;object-fit:cover}.photos .side{display:grid;grid-template-rows:1fr 1fr;gap:3px}.body{padding:20px}.body small{color:var(--gold);letter-spacing:.15em;font-size:9px}.body h2{font:28px Georgia,serif;margin:8px 0}.body p{color:#aebbb7;line-height:1.55;font-size:13px;min-height:40px}.from{color:var(--gold);font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.panel{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0a2024;border:1px solid #d6ad634d;box-shadow:0 30px 90px #000b}.panelTop{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.panelTop h2{font:32px Georgia,serif;margin:4px 0}.close{background:none;border:0;color:#fff;font-size:26px;cursor:pointer}.form{padding:26px;display:grid;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:9px;letter-spacing:.16em;color:#aebbb7}.field input,.field select,.field textarea{width:100%;padding:13px;background:#07181c;border:1px solid #ffffff22;color:#fff;border-radius:2px;font:inherit}.field textarea{min-height:80px;resize:vertical}.submit{padding:15px 18px;background:var(--gold);color:#07181c;border:0;font-weight:700;letter-spacing:.12em;cursor:pointer}.status{font-size:12px;color:#c4cdca}.status.error{color:#e58e7f}.success{color:#bfe8cf}.empty{padding:40px;border:1px dashed #ffffff2a;color:#aebbb7}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.photos{height:220px}}@media(max-width:560px){header{padding:16px}.wrap{padding:45px 18px 70px}.grid{grid-template-columns:1fr}.photos{height:230px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.panelTop{padding:20px}.form{padding:20px}}
.svcBadge{display:inline-block;margin:18px 0 6px;padding:8px 14px;border:1px solid #d6ad6355;border-radius:999px;color:#f2d798;font-size:12px;letter-spacing:.06em;background:#d6ad630d}.emptyCta{display:inline-block;margin-top:14px;color:#07181c;background:linear-gradient(135deg,#f2d798,#d6ad63,#b9853c);padding:12px 18px;border-radius:999px;font-weight:800;text-decoration:none;font-size:12px}header .back{margin-left:14px}</style><link rel="stylesheet" href="/theme.css"></head>
<body><div class="bg"></div>
<header><a class="brand" href="/"><img src="/logo-monogram.png" alt="SC"><span>SAMUI<br><small>CONCIERGE</small></span></a><div class="langSwitch" id="langSwitch"></div><a class="back" href="/" data-i18n="back">← BACK TO CONCIERGE</a></header>
<main class="wrap"><section class="hero"><div class="eyebrow" data-i18n="pp.eyebrow">PRIVATE PARTNER COLLECTION</div><h1 data-i18n="pp.h1">Choose your<br><i>place.</i></h1><div class="svcBadge" id="svcBadge"></div><p id="lead" data-i18n="pp.lead">Browse our selected local partners. Choose the one you prefer and send us your request. We will handle the confirmation directly with the partner.</p></section><section id="grid" class="grid" aria-live="polite"></section></main>
<div class="modal" id="modal" aria-hidden="true"><div class="panel" role="dialog" aria-modal="true"><div class="panelTop"><div><div class="eyebrow" id="modalEyebrow" data-i18n="pp.your">YOUR REQUEST</div><h2 id="modalTitle">Partner</h2><div id="modalDesc" class="status"></div></div><button class="close" id="close" data-i18n-aria="pp.close" aria-label="Close">×</button></div>
<form class="form" id="form"><div class="fields" id="fields"></div><div class="fields"><div class="field"><label data-i18n="req.where">WHERE ARE YOU?</label><input name="zone" required data-i18n-ph="pp.zone_ph" placeholder="Bophut / Villa name"></div><div class="field"><label data-i18n="req.name">YOUR NAME</label><input name="client_name" required data-i18n-ph="req.name_ph" placeholder="Your name"></div><div class="field"><label data-i18n="req.wa">WHATSAPP</label><input name="client_whatsapp" required placeholder="+66..."></div><div class="field"><label data-i18n="req.else">ANYTHING ELSE?</label><input name="notes" data-i18n-ph="pp.notes_ph" placeholder="Special requests..."></div></div>
<input type="hidden" name="service_name" id="serviceName"><input type="hidden" name="service_id" id="serviceId"><input type="hidden" name="partner_id" id="partnerId"><input type="hidden" name="flow" id="flow"><input type="hidden" name="lang" id="lang">
<button class="submit" type="submit" data-i18n="pp.send">SEND REQUEST TO SAMUI CONCIERGE →</button><div id="status" class="status" aria-live="polite"></div></form></div></div>
<script src="/i18n.js"></script>
<script>
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search),serviceName=qs.get('service')||'Restaurants';
let partners=[],selected=null;
const flowMap={'Restaurant Booking':'restaurant','Restaurants':'restaurant','Villa Search':'villa','Villas & Private Stays':'villa','Private Yacht':'boat','Sunset Cruise':'boat','Snorkeling':'boat','Fishing':'boat','Boat Transfer':'boat','Boat Trips & Charters':'boat','Fishing Trips':'boat','Diving & Snorkeling':'boat','Scooter Rental':'motorbike','Motorbike Rental':'motorbike','Car Rental':'car','Private Van':'van','Taxi & Private Transfers':'van','Airport Transfer':'airport','Airport & Ferry Transfers':'airport','Private Driver':'driver','Hair Salon':'salon','Beauty & Nail Salons':'salon'};
const presets={
 restaurant:[['date','Date','date',1],['time','Preferred time','time',1],['guests','Guests','number',1],['seating','Seating preference','select',0,['Indoor','Terrace','Beachfront','No preference']],['occasion','Occasion','text',0],['dietary','Dietary requirements','text',0]],
 villa:[['check_in','Check-in','date',1],['check_out','Check-out','date',1],['guests','Guests','number',1],['bedrooms','Bedrooms','number',0],['budget','Budget / night (THB)','number',0],['villa_type','Villa type','select',0,['Private pool','Beachfront','Family','Luxury','No preference']]],
 boat:[['date','Date','date',1],['time','Departure time','time',1],['guests','Guests','number',1],['duration','Duration','select',1,['Half day','Full day','Sunset','Custom']],['boat_size','Boat size','select',1,['Speedboat','Private yacht','Longtail boat','Catamaran','No preference']],['pickup','Pickup location','text',0],['trip_style','Trip style','text',0]],
 motorbike:[['date','Start date','date',1],['duration','Rental duration','select',1,['1 day','2–3 days','4–7 days','1–2 weeks','1 month']],['bike_class','Bike / class','select',1,['Scooter 110–125cc','Scooter 150–160cc','Premium scooter','Motorbike','No preference']],['quantity','Quantity','number',1],['delivery','Delivery / pickup area','text',0],['helmet','Helmets','select',0,['1','2','3','4+']]],
 car:[['date','Start date','date',1],['duration','Rental duration','select',1,['1 day','2–3 days','4–7 days','1–2 weeks','1 month']],['vehicle','Vehicle preference','text',1],['quantity','Quantity','number',1],['delivery','Delivery / pickup area','text',0]],
 van:[['date','Date','date',1],['time','Pickup time','time',1],['guests','Passengers','number',1],['pickup','Pickup location','text',1],['dropoff','Drop-off location','text',1],['luggage','Luggage','text',0]],
 airport:[['arrival_date','Arrival date','date',1],['arrival_time','Arrival time','time',1],['flight','Flight number','text',1],['passengers','Passengers','number',1],['pickup','Pickup location','text',1],['dropoff','Destination / villa','text',1],['luggage','Luggage','text',0]],
 driver:[['date','Date','date',1],['time','Start time','time',1],['duration','Duration','text',1],['passengers','Passengers','number',1],['pickup','Pickup location','text',1],['stops','Stops / itinerary','text',0]],
 salon:[['date','Appointment date','date',1],['time','Preferred time','time',1],['service','Salon service','select',1,['Cut','Color','Styling','Manicure / Pedicure','Other']],['guests','People','number',1]],
 generic:[['date','Date','date',0],['time','Preferred time','time',0],['guests','Guests','number',0]]
};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const flow=()=>flowMap[serviceName]||'partner';
function head(){$('#svcBadge').textContent=I18N.svcName(serviceName);document.title=t('pp.title',{s:I18N.svcName(serviceName)})}
async function init(){try{const r=await fetch('/api/partners?service='+encodeURIComponent(serviceName));partners=await r.json()}catch{partners=[]}render()}
function render(){head();const g=$('#grid');if(!partners.length){g.innerHTML=`<div class="empty">${esc(t('pp.empty'))}<br><a class="emptyCta" href="/#request">${esc(t('pp.empty_cta'))}</a></div>`;return}
 g.innerHTML=partners.map(p=>{const imgs=[p.image,...(p.images||[])].filter(Boolean).slice(0,3);while(imgs.length<3)imgs.push(p.image||'/media/fallbacks/dining.svg');
  return `<article class="card" data-id="${esc(p.id)}"><div class="photos"><img src="${esc(imgs[0])}" alt="${esc(p.name)}" onerror="this.src='/media/fallbacks/dining.svg'"><div class="side"><img src="${esc(imgs[1])}" alt="" onerror="this.src='/media/fallbacks/dining.svg'"><img src="${esc(imgs[2])}" alt="" onerror="this.src='/media/fallbacks/dining.svg'"></div></div><div class="body"><small>${esc(I18N.tr(p.category)||t('req.partner'))}</small><h2>${esc(p.name)}</h2><p>${esc(p.description||t('pp.default'))}</p>${p.price_from?`<div class="from">${esc(t('pp.from'))} ฿${Number(p.price_from).toLocaleString()}</div>`:''}</div></article>`}).join('');
 g.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openPartner(partners.find(p=>String(p.id)===String(c.dataset.id)))))}
function renderFields(){if(!selected)return;const box=$('#fields');const old={};box.querySelectorAll('[name]').forEach(e=>{if(e.value)old[e.name]=e.value});
 const fields=selected.booking_fields?.length?selected.booking_fields:(presets[flow()]||presets.generic);
 box.innerHTML=fields.map(f=>{const[n,l,ty,req,opt]=f,L=I18N.tr(l);
  if(ty==='select')return `<div class="field"><label>${esc(L)}${req?' *':''}</label><select name="detail_${esc(n)}" ${req?'required':''}><option value="">${esc(t('req.select'))}</option>${(opt||[]).map(o=>`<option value="${esc(o)}">${esc(I18N.tr(o))}</option>`).join('')}</select></div>`;
  return `<div class="field"><label>${esc(L)}${req?' *':''}</label><input name="detail_${esc(n)}" type="${esc(ty)}" ${req?'required':''}></div>`}).join('');
 Object.entries(old).forEach(([n,v])=>{const el=box.querySelector(`[name="${CSS.escape(n)}"]`);if(el)el.value=v});
 $('#modalDesc').textContent=selected.description||t('pp.modaldesc')}
function openPartner(p){selected=p;$('#modalTitle').textContent=p.name;$('#partnerId').value=p.id;$('#serviceName').value=serviceName;$('#serviceId').value=p.service_id||'';$('#flow').value=flow();$('#lang').value=I18N.lang;$('#fields').innerHTML='';renderFields();$('#status').textContent='';$('#status').className='status';$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false')}
function close(){$('#modal').classList.remove('open');$('#modal').setAttribute('aria-hidden','true');selected=null}
$('#close').addEventListener('click',close);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('langchange',()=>{render();renderFields();$('#lang').value=I18N.lang});
$('#form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector('.submit'),st=$('#status');btn.disabled=true;st.className='status';st.textContent=t('req.sending');$('#lang').value=I18N.lang;
 const raw=Object.fromEntries(new FormData(form));const details={};for(const k in raw)if(k.startsWith('detail_')){details[k.slice(7)]=raw[k];delete raw[k]}raw.details=details;
 try{const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(raw)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||t('req.failed'));st.className='status success';st.textContent=t('pp.sent',{id:j.id,name:selected?selected.name:''});form.reset();setTimeout(close,2200)}catch(err){st.className='status error';st.textContent=err.message}finally{btn.disabled=false}});
init();
</script></body></html>
